    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwa8sfY8NsoLEnez3VI04wwlRAWa7NH6FgUqfZhdwm_CTrwBYavsQZ57-k6zS4t9EGC/exec";
        
        let allProducts = [], cart = JSON.parse(localStorage.getItem('Premium SwagCart')) || [], selectedProduct = null, selectedSize = null, currentLightboxIndex = 0;

        const views = { home: document.getElementById('home-view'), product: document.getElementById('product-view'), cart: document.getElementById('cart-view'), checkout: document.getElementById('checkout-view') };
        
        const addProductSchema = (product) => {
            const oldSchema = document.getElementById('product-schema');
            if (oldSchema) oldSchema.remove();
            const schema = {
                "@context": "https://schema.org/",
                "@type": "Product",
                "name": product.Name,
                "image": product.Images[0],
                "description": product.Description,
                "sku": product.SKU,
                "brand": { "@type": "Brand", "name": "Premium Swag" },
                "offers": {
                    "@type": "Offer",
                    // MODIFIED: URL uses clean path
                    "url": `${window.location.origin}/product/${product.SKU}`,
                    "priceCurrency": "BDT",
                    "price": product.Price,
                    "availability": "https://schema.org/InStock",
                    "itemCondition": "https://schema.org/NewCondition"
                }
            };
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.id = 'product-schema';
            script.textContent = JSON.stringify(schema);
            document.head.appendChild(script);
        };

        const faviconLoader = {
            originalHref: '',
            loaderHref: 'data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfbTFT প্রাণেgBZoTJleVReRMAdeJ3mg6LzLfpBOpe6UOKmkAACP5BRIJAAwGV2l4pBOq0KjQpA4JADsAAAAAAAAAAAA=',
            iconElement: null,
            init() { this.iconElement = document.getElementById('favicon'); if (this.iconElement) this.originalHref = this.iconElement.href; },
            start() { if (this.iconElement) this.iconElement.href = this.loaderHref; },
            stop() { if (this.iconElement) this.iconElement.href = this.originalHref; }
        };

        const fetchWithCache = async (url, cacheKey, expiryMinutes = 1) => {
            faviconLoader.start();
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                const { timestamp, data } = JSON.parse(cached);
                if (Date.now() - timestamp < expiryMinutes * 60 * 1000) {
                    faviconLoader.stop(); return data;
                }
            }
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Network error.`);
                const result = await response.json();
                if (result.status !== 'success') throw new Error(result.message);
                localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: result.data }));
                return result.data;
            } catch (e) {
                console.error(`Fetch Error: ${e.message}`);
                throw new Error(`Could not load data.`);
            } finally {
                faviconLoader.stop();
            }
        };

        const initializeApp = async () => {
            faviconLoader.init();
            faviconLoader.start(); 
            document.getElementById('app-content').style.opacity = 1;
            document.getElementById('footer').classList.add('footer-visible');
            
            try {
                const [products, deliveryCharges] = await Promise.all([
                    fetchWithCache(`${WEB_APP_URL}?action=getProducts`, 'Premium SwagProducts', 5),
                    fetchWithCache(`${WEB_APP_URL}?action=getDeliveryCharges`, 'Premium SwagDelivery', 60)
                ]);
                allProducts = products;
                renderCategories(products);
                renderDeliveryZones(deliveryCharges);
                updateCartCount();
                setupSearchOverlay();
                await handleRouteChange(true);
            } catch (error) {
                showAlert(error.message);
            } finally {
                faviconLoader.stop();
            }
        };

        // MODIFIED: Logic to handle clean URLs from pathname
        const handleRouteChange = async (isNavigation = false) => {
            const path = window.location.pathname;
            const parts = path.split('/').filter(Boolean);
            const route = parts[0] || 'home';
            const param = parts[1];

            Object.values(views).forEach(view => view.classList.add('hidden'));
            
            if (route === 'home' || route === 'category') {
                views.home.classList.remove('hidden');
                const pageTitleEl = document.getElementById('page-title');
                
                if(isNavigation) {
                    faviconLoader.start();
                    pageTitleEl.classList.add('hidden');
                    renderSkeletons(8);
                }

                let productsToRender = allProducts;
                let pageTitle = "All Products";
                let isCategoryPage = false;
                
                if (route === 'category' && param) {
                    productsToRender = allProducts.filter(p => p.Category === param);
                    pageTitle = param;
                    isCategoryPage = true;
                }

                const searchTerm = document.getElementById('product-search-input').value.toLowerCase();
                if (searchTerm) {
                    productsToRender = productsToRender.filter(p => p.Name.toLowerCase().includes(searchTerm));
                }

                let oldMetaDesc = document.querySelector("meta[name='description']");
                if (oldMetaDesc) oldMetaDesc.remove();
                const metaDesc = document.createElement('meta');
                metaDesc.name = 'description';

                if (isCategoryPage) {
                    document.title = `${pageTitle} Collection - Premium Swag`;
                    const productNames = productsToRender.slice(0, 3).map(p => p.Name).join(', ');
                    metaDesc.content = `Explore our exclusive ${pageTitle} collection, featuring ${productNames} and more. Shop the latest designs today!`;
                } else {
                    document.title = 'Premium Swag - Authentic & Stylish Fashion';
                    metaDesc.content = 'Discover authentic and stylish fashion at Premium Swag.';
                }
                document.head.appendChild(metaDesc);

                if(isNavigation) await new Promise(res => setTimeout(res, 300));
                
                renderProductGrid(productsToRender);
                pageTitleEl.textContent = pageTitle;
                pageTitleEl.classList.remove('hidden');
                faviconLoader.stop();

            } else if (route === 'product' && param) {
                views.product.classList.remove('hidden');
                selectedProduct = allProducts.find(p => p.SKU == param);
                if (selectedProduct) {
                    renderProductPage(selectedProduct);
                } else {
                    window.history.replaceState({}, '', '/');
                    handleRouteChange(true);
                }
            } else if (route === 'cart') {
                views.cart.classList.remove('hidden');
                renderCartPage();
            } else if (route === 'checkout') {
                views.checkout.classList.remove('hidden');
                renderCheckoutPage();
            } else { // Fallback for any other URL, show home
                window.history.replaceState({}, '', '/');
                handleRouteChange(true);
            }
            window.scrollTo(0, 0);
        };
        
        const setupSearchOverlay = () => {
            // ... (unchanged)
        };

        const renderSkeletons = (count = 8) => {
            const grid = document.getElementById('product-grid');
            if(!grid) return;
            // ... (rest is unchanged)
        };

        const renderProductGrid = (products) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = (!products || products.length === 0) ? `<p class="col-span-full text-center text-gray-500">No products found.</p>` : products.map(p => `
                <a href="/product/${p.SKU}" onclick="handleNav(event, '/product/${p.SKU}', true)" class="bg-white rounded-lg shadow-lg overflow-hidden group flex flex-col">
                    <div class="aspect-[2/3] bg-gray-200 overflow-hidden">
                        <img src="${p.Images[0] || 'https://placehold.co/400x600/e2e8f0/333?text=No+Image'}" alt="${p.Name}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                    </div>
                    <div class="p-4 text-center flex flex-col flex-grow">
                        <h3 class="text-sm font-medium text-gray-800 leading-tight flex-grow">${p.Name}</h3>
